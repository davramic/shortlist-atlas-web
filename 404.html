<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Shortlist Atlas</title>
<meta name="description" content="The Shortlist Atlas website is being refreshed and will return soon.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Cormorant";src:url(/assets/fonts/cormorant-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(/assets/fonts/ebg-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Jost";src:url(/assets/fonts/jost-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--sea:#0b1524;--navy:#121f33;--gold:#c9a24e;--gold-lt:#e7cd82;--paper:#f7f5ef;--muted:#b8c0cc}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#1d2e48 0%,var(--navy) 45%,var(--sea) 100%);background-color:var(--sea);color:var(--paper);font-family:"EB Garamond",Georgia,serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{max-width:560px;width:100%;text-align:center;padding:48px 32px;border:1px solid rgba(201,162,78,.45);border-radius:6px;background:linear-gradient(180deg,rgba(18,31,51,.92),rgba(11,21,36,.92));box-shadow:0 0 0 6px rgba(201,162,78,.06),0 30px 80px rgba(0,0,0,.45)}
.kicker{font-family:"Jost",system-ui,sans-serif;font-weight:500;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--gold)}
h1{font-family:"Cormorant",Georgia,serif;font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:14px 0 18px;background:linear-gradient(180deg,var(--gold-lt),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:72px;height:1px;background:var(--gold);margin:0 auto 22px;opacity:.7}
p{font-size:19px;line-height:1.55;color:var(--muted)}
a{color:var(--gold-lt)}
.contact{margin-top:26px;font-family:"Jost",system-ui,sans-serif;font-size:14px;letter-spacing:.04em}
</style>
</head>
<body>
<main class="card">
<div class="kicker">The Shortlist Atlas</div>
<h1>Back Soon</h1>
<div class="rule"></div>
<p>Our website is being refreshed and will return shortly.</p>
<p class="contact">Questions: <a href="mailto:support@theshortlistatlas.com">support@theshortlistatlas.com</a></p>
</main>
</body>
</html>
